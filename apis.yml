description: GrokStyle was a visual-search / computer-vision startup (a Cornell Tech spinout) that let
  users find products such as furniture and home decor from a photo, backed by Canaan Partners. It was
  acquired by Facebook in early 2019 and wound down. As of this enrichment pass its domain (grokstyle.com)
  is registered but resolves to no nameservers, there is no live website, developer portal, API, SDK, or
  GitHub organization, so there is no public API surface to enrich. This profile is retained as a
  historical portfolio lead in the API Evangelist network.
